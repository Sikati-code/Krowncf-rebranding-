name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Run linter
        run: npm run lint -- --ext .ts,.tsx,.js,.jsx --max-warnings=0
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app
