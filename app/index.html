<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Krown Creative Factory</title>
    <meta name="description" content="Krown Creative Factory - Africa's premier graphic design marketplace. Premium designs, templates, and creative assets." />
    <meta name="keywords" content="graphic design, creative factory, logo design, branding, templates, Africa, Nigeria, Cameroon, creative assets, design marketplace" />
    <meta name="author" content="Krown Creative Factory" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://krowncf.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://krowncf.com/" />
    <meta property="og:title" content="Krown Creative Factory" />
    <meta property="og:description" content="Africa's premier graphic design marketplace. Premium designs, templates, and creative assets." />
    <meta property="og:image" content="https://krowncf.com/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Krown Creative Factory — krowncf.com" />
    <meta property="og:site_name" content="Krown Creative Factory" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://krowncf.com/" />
    <meta name="twitter:title" content="Krown Creative Factory" />
    <meta name="twitter:description" content="Africa's premier graphic design marketplace. Premium designs, templates, and creative assets." />
    <meta name="twitter:image" content="https://krowncf.com/assets/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Krown CF" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <style>
      /* Critical CSS for preventing FOUC */
      html { background-color: #0A0A0A; }
      body { margin: 0; padding: 0; background-color: #0A0A0A; color: #ffffff; }
      #root { min-height: 100vh; background-color: #0A0A0A; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
