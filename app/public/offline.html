      button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #DC2626, #E85D04); font-size: 15px; }

  </head>

      <img src="/icons/icon-192.png" alt="Krown Creative Factory" />
